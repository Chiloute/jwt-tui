version: 2

before:
  hooks:
    - go mod tidy

builds:
  - binary: jwt-tui
    main: ./cmd/jwt-tui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - package_name: jwt-tui
    formats:
      - deb
    maintainer: Chiloute <chiloute@proton.me>
    description: JWT inspector and signer in the terminal
    license: MIT
    homepage: https://github.com/Chiloute/jwt-tui
    bindir: /usr/bin

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  # Le projet est encore en beta : toutes les releases v0.x sont marquées prerelease.
  prerelease: true
